
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐆𝐢𝐭𝐇𝐮𝐛 𝐒𝐜𝐫𝐚𝐩𝐞𝐫</title>
    <style>
        /* ============================================================
           𝐆𝐥𝐨𝐛𝐚𝐥 𝐒𝐭𝐲𝐥𝐞𝐬
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }

        /* ============================================================
           𝐂𝐨𝐧𝐭𝐚𝐢𝐧𝐞𝐫
           ============================================================ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============================================================
           𝐇𝐞𝐚𝐝𝐞𝐫
           ============================================================ */
        .header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid #30363d;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 42px;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #8b949e;
            font-size: 18px;
        }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        .badge.online {
            background: #238636;
            color: #ffffff;
        }

        .badge.offline {
            background: #da3633;
            color: #ffffff;
        }

        /* ============================================================
           𝐒𝐞𝐚𝐫𝐜𝐡 𝐁𝐨𝐱
           ============================================================ */
        .search-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .search-box label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f0f6fc;
        }

        .search-box .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            padding: 12px 18px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 16px;
            min-width: 200px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .search-box input::placeholder {
            color: #8b949e;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #238636;
            color: white;
        }

        .btn-primary:hover {
            background: #2ea043;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            background: #30363d;
        }

        .btn-danger {
            background: #da3633;
            color: white;
        }

        .btn-danger:hover {
            background: #f85149;
        }

        .btn-success {
            background: #1f6feb;
            color: white;
        }

        .btn-success:hover {
            background: #58a6ff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        /* ============================================================
           𝐒𝐭𝐚𝐭𝐬
           ============================================================ */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #58a6ff;
        }

        .stat-card .label {
            font-size: 13px;
            color: #8b949e;
            margin-top: 5px;
        }

        /* ============================================================
           𝐑𝐞𝐬𝐮𝐥𝐭𝐬
           ============================================================ */
        .results {
            display: none;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
        }

        .results.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results h2 {
            color: #f0f6fc;
            font-size: 24px;
            margin-bottom: 15px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        .result-section {
            margin-bottom: 25px;
        }

        .result-section h3 {
            color: #58a6ff;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .result-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .result-item:hover {
            border-color: #58a6ff;
        }

        .result-item .repo {
            color: #58a6ff;
            font-weight: bold;
        }

        .result-item .path {
            color: #8b949e;
            font-size: 14px;
        }

        .result-item .url {
            color: #58a6ff;
            font-size: 12px;
            word-break: break-all;
        }

        .result-item .url a {
            color: #58a6ff;
            text-decoration: none;
        }

        .result-item .url a:hover {
            text-decoration: underline;
        }

        .secret-hit {
            background: #1c1c1c;
            border-left: 3px solid #da3633;
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 13px;
            font-family: monospace;
            color: #f0883e;
        }

        .secret-hit .type {
            color: #f0883e;
            font-weight: bold;
        }

        .secret-hit .snippet {
            color: #c9d1d9;
            word-break: break-all;
        }

        /* ============================================================
           𝐋𝐨𝐚𝐝𝐢𝐧𝐠
           ============================================================ */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #8b949e;
            font-size: 16px;
        }

        /* ============================================================
           𝐄𝐫𝐫𝐨𝐫
           ============================================================ */
        .error {
            display: none;
            background: #1c1c1c;
            border: 1px solid #da3633;
            border-radius: 8px;
            padding: 15px;
            color: #f85149;
            margin-top: 15px;
        }

        .error.active {
            display: block;
        }

        /* ============================================================
           𝐑𝐞𝐬𝐩𝐨𝐧𝐬𝐢𝐯𝐞
           ============================================================ */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }

            .search-box .input-group {
                flex-direction: column;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 10px;
            }

            body {
                padding: 10px;
            }
        }

        /* ============================================================
           𝐒𝐜𝐫𝐨𝐥𝐥𝐛𝐚𝐫
           ============================================================ */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ==========================================================
        𝐇𝐄𝐀𝐃𝐄𝐑
        ========================================================== -->
        <div class="header">
            <h1>🔍 𝐆𝐢𝐭𝐇𝐮𝐛 𝐒𝐜𝐫𝐚𝐩𝐞𝐫</h1>
            <p>𝐎𝐒𝐈𝐍𝐓 𝐑𝐞𝐜𝐨𝐧𝐧𝐚𝐢𝐬𝐬𝐚𝐧𝐜𝐞 — 𝐅𝐢𝐧𝐝 𝐞𝐱𝐩𝐨𝐬𝐞𝐝 𝐬𝐞𝐜𝐫𝐞𝐭𝐬 & 𝐞𝐦𝐚𝐢𝐥𝐬</p>
            <span class="badge online" id="statusBadge">✅ 𝐎𝐧𝐥𝐢𝐧𝐞</span>
        </div>

        <!-- ==========================================================
        𝐒𝐄𝐀𝐑𝐂𝐇
        ========================================================== -->
        <div class="search-box">
            <label>🎯 𝐄𝐧𝐭𝐞𝐫 𝐆𝐢𝐭𝐇𝐮𝐛 𝐔𝐬𝐞𝐫𝐧𝐚𝐦𝐞 𝐨𝐫 𝐎𝐫𝐠𝐚𝐧𝐢𝐳𝐚𝐭𝐢𝐨𝐧</label>
            <div class="input-group">
                <input 
                    type="text" 
                    id="targetInput" 
                    placeholder="𝐄.𝐠. 𝐦𝐢𝐜𝐫𝐨𝐬𝐨𝐟𝐭, 𝐠𝐨𝐨𝐠𝐥𝐞, 𝐭𝐨𝐫𝐯𝐚𝐥𝐝𝐬"
                    onkeypress="if(event.key==='Enter') runFullScan()"
                >
                <button class="btn btn-primary" id="scanBtn" onclick="runFullScan()">
                    🚀 𝐅𝐮𝐥𝐥 𝐒𝐜𝐚𝐧
                </button>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="runScan('scrape')">
                    📊 𝐒𝐜𝐫𝐚𝐩𝐞
                </button>
                <button class="btn btn-secondary" onclick="runScan('emails')">
                    📧 𝐄𝐦𝐚𝐢𝐥𝐬
                </button>
                <button class="btn btn-secondary" onclick="runScan('env')">
                    🔍 .𝐄𝐧𝐯
                </button>
                <button class="btn btn-secondary" onclick="runScan('keys')">
                    🔑 𝐊𝐞𝐲𝐬
                </button>
                <button class="btn btn-secondary" onclick="runScan('report')">
                    📋 𝐑𝐞𝐩𝐨𝐫𝐭
                </button>
            </div>
        </div>

        <!-- ==========================================================
        𝐒𝐓𝐀𝐓𝐒
        ========================================================== -->
        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="number" id="statRepos">-</div>
                <div class="label">📦 𝐑𝐞𝐩𝐨𝐬𝐢𝐭𝐨𝐫𝐢𝐞𝐬</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statEmails">-</div>
                <div class="label">📧 𝐄𝐦𝐚𝐢𝐥𝐬</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statEnv">-</div>
                <div class="label">🔍 .𝐄𝐧𝐯 𝐅𝐢𝐥𝐞𝐬</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statSecrets">-</div>
                <div class="label">🔑 𝐒𝐞𝐜𝐫𝐞𝐭𝐬</div>
            </div>
        </div>

        <!-- ==========================================================
        𝐋𝐎𝐀𝐃𝐈𝐍𝐆
        ========================================================== -->
        <div class="loading" id="loadingContainer">
            <div class="spinner"></div>
            <p>🔎 <strong id="loadingText">𝐒𝐜𝐚𝐧𝐧𝐢𝐧𝐠...</strong></p>
            <p style="font-size: 14px; color: #8b949e;">𝐓𝐡𝐢𝐬 𝐦𝐚𝐲 𝐭𝐚𝐤𝐞 𝐚 𝐟𝐞𝐰 𝐦𝐨𝐦𝐞𝐧𝐭𝐬</p>
        </div>

        <!-- ==========================================================
        𝐄𝐑𝐑𝐎𝐑
        ========================================================== -->
        <div class="error" id="errorContainer">
            ❌ <strong id="errorText">𝐄𝐫𝐫𝐨𝐫</strong>
        </div>

        <!-- ==========================================================
        𝐑𝐄𝐒𝐔𝐋𝐓𝐒
        ========================================================== -->
        <div class="results" id="resultsContainer">
            <h2>📊 <span id="resultTitle">𝐒𝐜𝐚𝐧 𝐑𝐞𝐬𝐮𝐥𝐭𝐬</span></h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <!-- ============================================================
    𝐉𝐀𝐕𝐀𝐒𝐂𝐑𝐈𝐏𝐓
    ============================================================ -->
    <script>
        // ============================================================
        // 𝐃𝐎𝐌 𝐑𝐞𝐟𝐞𝐫𝐞𝐧𝐜𝐞𝐬
        // ============================================================
        const targetInput = document.getElementById('targetInput');
        const scanBtn = document.getElementById('scanBtn');
        const loadingContainer = document.getElementById('loadingContainer');
        const errorContainer = document.getElementById('errorContainer');
        const errorText = document.getElementById('errorText');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        const loadingText = document.getElementById('loadingText');
        const statusBadge = document.getElementById('statusBadge');

        // 𝐒𝐭𝐚𝐭𝐬
        const statRepos = document.getElementById('statRepos');
        const statEmails = document.getElementById('statEmails');
        const statEnv = document.getElementById('statEnv');
        const statSecrets = document.getElementById('statSecrets');

        // ============================================================
        // 𝐅𝐮𝐧𝐜𝐭𝐢𝐨𝐧𝐬
        // ============================================================
        function showLoading(text = '𝐒𝐜𝐚𝐧𝐧𝐢𝐧𝐠...') {
            loadingText.textContent = text;
            loadingContainer.classList.add('active');
            errorContainer.classList.remove('active');
            resultsContainer.classList.remove('active');
            scanBtn.disabled = true;
        }

        function hideLoading() {
            loadingContainer.classList.remove('active');
            scanBtn.disabled = false;
        }

        function showError(message) {
            errorText.textContent = message;
            errorContainer.classList.add('active');
            hideLoading();
        }

        function showResults(title, data) {
            resultTitle.textContent = title;
            resultsContainer.classList.add('active');
            hideLoading();

            // 𝐔𝐩𝐝𝐚𝐭𝐞 𝐬𝐭𝐚𝐭𝐬
            statRepos.textContent = data.repo_count || data.repos?.length || 0;
            statEmails.textContent = data.emails ? Object.keys(data.emails).length : 0;
            statEnv.textContent = data.env_files ? data.env_files.length : 0;
            
            let secretCount = 0;
            if (data.secret_findings) {
                data.secret_findings.forEach(f => secretCount += f.hits.length);
            }
            statSecrets.textContent = secretCount;

            // 𝐆𝐞𝐧𝐞𝐫𝐚𝐭𝐞 𝐜𝐨𝐧𝐭𝐞𝐧𝐭
            let html = '';

            // 𝐏𝐫𝐨𝐟𝐢𝐥𝐞
            if (data.profile) {
                const p = data.profile;
                html += `
                    <div class="result-section">
                        <h3>👤 𝐏𝐫𝐨𝐟𝐢𝐥𝐞</h3>
                        <div class="result-item">
                            <strong>${p.login || 'N/A'}</strong> (${p.type || 'N/A'})<br>
                            ${p.name ? `📛 ${p.name}<br>` : ''}
                            ${p.location ? `📍 ${p.location}<br>` : ''}
                            ${p.email ? `📧 ${p.email}<br>` : ''}
                            ${p.blog ? `🔗 ${p.blog}<br>` : ''}
                            ${p.bio ? `📝 ${p.bio}<br>` : ''}
                            📦 ${p.public_repos || 0} 𝐩𝐮𝐛𝐥𝐢𝐜 𝐫𝐞𝐩𝐨𝐬
                        </div>
                    </div>
                `;
            }

            // 𝐑𝐞𝐩𝐨𝐬
            if (data.repos && data.repos.length > 0) {
                html += `
                    <div class="result-section">
                        <h3>📦 𝐑𝐞𝐩𝐨𝐬𝐢𝐭𝐨𝐫𝐢𝐞𝐬 (${data.repos.length})</h3>
                `;
                data.repos.slice(0, 20).forEach(repo => {
                    html += `
                        <div class="result-item">
                            <div class="repo">${repo.name}</div>
                            ${repo.description ? `<div>📝 ${repo.description}</div>` : ''}
                            <div>⭐ ${repo.stars || 0} | 💻 ${repo.language || 'N/A'}</div>
                            <div class="url"><a href="${repo.url}" target="_blank">${repo.url}</a></div>
                        </div>
                    `;
                });
                if (data.repos.length > 20) {
                    html += `<p style="color:#8b949e;">...𝐚𝐧𝐝 ${data.repos.length - 20} 𝐦𝐨𝐫𝐞</p>`;
                }
                html += `</div>`;
            }

            // .𝐄𝐧𝐯 𝐅𝐢𝐥𝐞𝐬
            if (data.env_files && data.env_files.length > 0) {
                html += `
                    <div class="result-section">
                        <h3>🔍 .𝐄𝐧𝐯/𝐂𝐨𝐧𝐟𝐢𝐠 𝐅𝐢𝐥𝐞𝐬 (${data.env_files.length})</h3>
                `;
                data.env_files.slice(0, 10).forEach(f => {
                    html += `
                        <div class="result-item">
                            <div class="repo">${f.repo}</div>
                            <div class="path">📄 ${f.path}</div>
                            <div class="url"><a href="${f.url}" target="_blank">${f.url}</a></div>
                    `;
                    if (f.hits && f.hits.length > 0) {
                        f.hits.slice(0, 3).forEach(hit => {
                            html += `
                                <div class="secret-hit">
                                    <span class="type">🔑 [${hit[0]}]</span>
                                    <span class="snippet">${redact(hit[1])}</span>
                                </div>
                            `;
                        });
                    }
                    html += `</div>`;
                });
                if (data.env_files.length > 10) {
                    html += `<p style="color:#8b949e;">...𝐚𝐧𝐝 ${data.env_files.length - 10} 𝐦𝐨𝐫𝐞</p>`;
                }
                html += `</div>`;
            }

            // 𝐒𝐞𝐜𝐫𝐞𝐭 𝐅𝐢𝐧𝐝𝐢𝐧𝐠𝐬
            if (data.secret_findings && data.secret_findings.length > 0) {
                html += `
                    <div class="result-section">
                        <h3>🔑 𝐒𝐞𝐜𝐫𝐞𝐭 𝐅𝐢𝐧𝐝𝐢𝐧𝐠𝐬 (${data.secret_findings.length} 𝐟𝐢𝐥𝐞𝐬)</h3>
                `;
                data.secret_findings.slice(0, 10).forEach(f => {
                    html += `
                        <div class="result-item">
                            <div class="repo">${f.repo}</div>
                            <div class="path">📄 ${f.path}</div>
                            <div class="url"><a href="${f.url}" target="_blank">${f.url}</a></div>
                    `;
                    if (f.hits && f.hits.length > 0) {
                        f.hits.slice(0, 3).forEach(hit => {
                            html += `
                                <div class="secret-hit">
                                    <span class="type">🔑 [${hit[0]}]</span>
                                    <span class="snippet">${redact(hit[1])}</span>
                                </div>
                            `;
                        });
                    }
                    html += `</div>`;
                });
                if (data.secret_findings.length > 10) {
                    html += `<p style="color:#8b949e;">...𝐚𝐧𝐝 ${data.secret_findings.length - 10} 𝐦𝐨𝐫𝐞</p>`;
                }
                html += `</div>`;
            }

            // 𝐄𝐦𝐚𝐢𝐥𝐬
            if (data.emails && Object.keys(data.emails).length > 0) {
                const emails = Object.entries(data.emails).slice(0, 30);
                html += `
                    <div class="result-section">
                        <h3>📧 𝐄𝐦𝐚𝐢𝐥𝐬 (${Object.keys(data.emails).length})</h3>
                `;
                emails.forEach(([email, info]) => {
                    html += `
                        <div class="result-item">
                            <strong>${info.name}</strong> &lt;${email}&gt;<br>
                            <span style="color:#8b949e;font-size:13px;">
                                📦 ${info.repos.slice(0, 3).join(', ')}${info.repos.length > 3 ? ` +${info.repos.length - 3}` : ''}
                            </span>
                        </div>
                    `;
                });
                if (Object.keys(data.emails).length > 30) {
                    html += `<p style="color:#8b949e;">...𝐚𝐧𝐝 ${Object.keys(data.emails).length - 30} 𝐦𝐨𝐫𝐞</p>`;
                }
                html += `</div>`;
            }

            if (!html) {
                html = '<p style="color:#8b949e;">✅ 𝐍𝐨 𝐫𝐞𝐬𝐮𝐥𝐭𝐬 𝐟𝐨𝐮𝐧𝐝</p>';
            }

            resultContent.innerHTML = html;
        }

        function redact(text) {
            if (text.length > 40) {
                return text.substring(0, 18) + '…' + text.substring(text.length - 6);
            }
            return text;
        }

        // ============================================================
        // 𝐀𝐏𝐈 𝐂𝐚𝐥𝐥𝐬
        // ============================================================
        async function runScan(type) {
            const target = targetInput.value.trim();
            if (!target) {
                showError('𝐏𝐥𝐞𝐚𝐬𝐞 𝐞𝐧𝐭𝐞𝐫 𝐚 𝐆𝐢𝐭𝐇𝐮𝐛 𝐮𝐬𝐞𝐫𝐧𝐚𝐦𝐞 𝐨𝐫 𝐨𝐫𝐠𝐚𝐧𝐢𝐳𝐚𝐭𝐢𝐨𝐧');
                return;
            }

            const labels = {
                scrape: '📊 𝐏𝐫𝐨𝐟𝐢𝐥𝐞 & 𝐑𝐞𝐩𝐨𝐬',
                emails: '📧 𝐄𝐦𝐚𝐢𝐥 𝐇𝐚𝐫𝐯𝐞𝐬𝐭',
                env: '🔍 .𝐄𝐧𝐯 𝐅𝐢𝐥𝐞𝐬',
                keys: '🔑 𝐒𝐞𝐜𝐫𝐞𝐭 𝐒𝐜𝐚𝐧',
                report: '📋 𝐅𝐮𝐥𝐥 𝐑𝐞𝐩𝐨𝐫𝐭'
            };

            showLoading(`🔄 ${labels[type] || '𝐒𝐜𝐚𝐧𝐧𝐢𝐧𝐠'} ${target}...`);

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ target: target, type: type })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '𝐒𝐜𝐚𝐧 𝐟𝐚𝐢𝐥𝐞𝐝');
                }

                // 𝐂𝐡𝐞𝐜𝐤 𝐢𝐟 𝐢𝐭'𝐬 𝐚 𝐟𝐢𝐥𝐞 𝐝𝐨𝐰𝐧𝐥𝐨𝐚𝐝
                const contentDisposition = response.headers.get('Content-Disposition');
                if (contentDisposition && contentDisposition.includes('attachment')) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = contentDisposition.match(/filename="(.+)"/)?.[1] || 'report.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    hideLoading();
                    return;
                }

                const data = await response.json();
                if (data.error) {
                    showError(data.error);
                    return;
                }

                showResults(labels[type] || '𝐒𝐜𝐚𝐧 𝐑𝐞𝐬𝐮𝐥𝐭𝐬', data);

            } catch (error) {
                showError(`❌ ${error.message}`);
                console.error('Error:', error);
            }
        }

        async function runFullScan() {
            await runScan('full');
        }

        // ============================================================
        // 𝐇𝐞𝐚𝐥𝐭𝐡 𝐂𝐡𝐞𝐜𝐤
        // ============================================================
        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                if (response.ok) {
                    statusBadge.textContent = '✅ 𝐎𝐧𝐥𝐢𝐧𝐞';
                    statusBadge.className = 'badge online';
                } else {
                    statusBadge.textContent = '❌ 𝐎𝐟𝐟𝐥𝐢𝐧𝐞';
                    statusBadge.className = 'badge offline';
                }
            } catch {
                statusBadge.textContent = '❌ 𝐎𝐟𝐟𝐥𝐢𝐧𝐞';
                statusBadge.className = 'badge offline';
            }
        }

        // 𝐂𝐡𝐞𝐜𝐤 𝐞𝐯𝐞𝐫𝐲 30 𝐬𝐞𝐜𝐨𝐧𝐝𝐬
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
